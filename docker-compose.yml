services:
  mysql:
    image: mysql:8.0
    container_name: rpg-market-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: rpg_market
      MYSQL_USER: rpg_user
      MYSQL_PASSWORD: rpg_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - rpg-network

  migrate:
    image: migrate/migrate
    container_name: rpg-market-migrate
    volumes:
      - ./migrations:/migrations
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "mysql://root:password@tcp(mysql:3306)/rpg_market"
      - "up"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    networks:
      - rpg-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpg-market-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # .envで定義したファイル名を使う
      - ./${FIREBASE_CREDENTIALS_PATH}:/app/firebase-credentials.json:ro
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - rpg-network

volumes:
  mysql_data:

networks:
  rpg-network:
    driver: bridge
