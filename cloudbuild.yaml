steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "--no-cache"
      - "-t"
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - "-f"
      - Dockerfile
    id: Build

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    id: Push

  # マイグレーション用イメージのビルド
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/rpg-market-migrate:$COMMIT_SHA
      - "-f"
      - Dockerfile.migrate
      - .
    id: Build-Migrate

  # マイグレーション用イメージのプッシュ
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - >-
        $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/rpg-market-migrate:$COMMIT_SHA
    id: Push-Migrate
    waitFor: ["Build-Migrate"]

  # マイグレーション用Cloud Runジョブのデプロイ
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      - run
      - jobs
      - deploy
      - rpg-market-migrate
      - >-
        --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/rpg-market-migrate:$COMMIT_SHA
      - "--region=$_DEPLOY_REGION"
      - "--set-cloudsql-instances=$_CLOUDSQL_INSTANCE"
      - "--set-secrets=DATABASE_URL=database-url:latest"
      - "--max-retries=1"
      - "--task-timeout=10m"
    id: Deploy-Migrate-Job
    entrypoint: gcloud
    waitFor: ["Push-Migrate"]

  # マイグレーションを実行
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      - run
      - jobs
      - execute
      - rpg-market-migrate
      - "--region=$_DEPLOY_REGION"
      - "--wait"
    id: Execute-Migration
    entrypoint: gcloud
    waitFor: ["Deploy-Migrate-Job"]

  # 既存を変更: Cloud Runサービスのデプロイ（マイグレーション成功後のみ）
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - "--platform=managed"
      - >-
        --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - >-
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - "--region=$_DEPLOY_REGION"
      - "--add-cloudsql-instances=$_CLOUDSQL_INSTANCE"
      - "--set-secrets=DB_USER=db-user:latest,DB_PASSWORD=db-password:latest,DB_NAME=db-name:latest"
      - "--set-secrets=/secrets/firebase-credentials/firebase-credentials.json=firebase-credentials:latest"
      - "--update-env-vars=DB_HOST=$_DB_HOST,ENV=production"
      - "--quiet"
    id: Deploy
    entrypoint: gcloud
    waitFor: ["Execute-Migration", "Push"] # 🔧 マイグレーション完了を待つ

images:
  - >-
    $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _AR_REPOSITORY: cloud-run-source-deploy
  _AR_PROJECT_ID: term8-shunsei-suzuki
  _PLATFORM: managed
  _TRIGGER_ID: 2ebb9436-5bf9-4580-b62b-cce8964c125d
  _SERVICE_NAME: rpg-market-backend
  _DEPLOY_REGION: us-central1
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _CLOUDSQL_INSTANCE: term8-shunsei-suzuki:us-central1:uttc
  _DB_HOST: term8-shunsei-suzuki:us-central1:uttc
tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - rpg-market-backend
